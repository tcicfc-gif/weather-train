<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고속철도 날씨 정보 - KTX/SRT 실시간 날씨</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN (for JSX compilation) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <div id="root"></div>

  <!-- React code starts here -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const Icons = {
      Train: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 15h16"/><path d="M4 11h16"/><path d="M12 3v18"/><path d="M6 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M18 19h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M14 8h-4"/><path d="M14 12h-4"/></svg>
      ),
      Search: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      ),
      Key: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      ),
      Temp: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
      ),
      Droplets: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.09 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M17 18.5c1.37 0 2.5-1.14 2.5-2.53 0-.72-.35-1.41-1.07-2s-1.25-1.56-1.43-2.47c-.18.91-.71 1.77-1.43 2.35s-1.07 1.28-1.07 2c0 1.39 1.13 2.53 2.5 2.53z"/></svg>
      ),
      Wind: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 15.6A2 2 0 1 1 18 12H2"/><path d="M9.8 5.8A2 2 0 1 0 9 10h11"/></svg>
      ),
      Info: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      ),
      Settings: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      ),
      Refresh: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      )
    };

    // 철도 노선 및 역 정보 데이터
    const STATIONS = {
      "경부선": [
        { id: "seoul", name: "서울", lat: 37.5546, lon: 126.9706 },
        { id: "yeongdeungpo", name: "영등포", lat: 37.5155, lon: 126.9076 },
        { id: "suwon", name: "수원", lat: 37.2662, lon: 126.9998 },
        { id: "daejeon", name: "대전", lat: 36.3312, lon: 127.4334 },
        { id: "gimcheon-gumi", name: "김천구미", lat: 36.1158, lon: 128.1798 },
        { id: "dongdaegu", name: "동대구", lat: 35.8797, lon: 128.6285 },
        { id: "gyeongju", name: "경주", lat: 35.7981, lon: 129.1398 },
        { id: "ulsan", name: "울산", lat: 35.5532, lon: 129.1386 },
        { id: "busan", name: "부산", lat: 35.1154, lon: 129.0422 }
      ],
      "호남선": [
        { id: "yongsan", name: "용산", lat: 37.5298, lon: 126.9648 },
        { id: "gwangmyeong", name: "광명", lat: 37.4273, lon: 126.8906 },
        { id: "cheonan-asan", name: "천안아산", lat: 36.7944, lon: 127.1044 },
        { id: "osong", name: "오송", lat: 36.6219, lon: 127.3244 },
        { id: "gongju", name: "공주", lat: 36.4385, lon: 127.2001 },
        { id: "iksan", name: "익산", lat: 35.9410, lon: 126.9427 },
        { id: "jeongeup", name: "정읍", lat: 35.5752, lon: 126.8430 },
        { id: "gwangju-songjeong", name: "광주송정", lat: 35.1376, lon: 126.7915 },
        { id: "naju", name: "나주", lat: 35.0142, lon: 126.7163 },
        { id: "mokpo", name: "목포", lat: 34.7912, lon: 126.3863 }
      ],
      "전라선": [
        { id: "yongsan", name: "용산", lat: 37.5298, lon: 126.9648 },
        { id: "osong", name: "오송", lat: 36.6219, lon: 127.3244 },
        { id: "seodaejeon", name: "서대전", lat: 36.3227, lon: 127.4039 },
        { id: "iksan", name: "익산", lat: 35.9410, lon: 126.9427 },
        { id: "jeonju", name: "전주", lat: 35.8497, lon: 127.1617 },
        { id: "namwon", name: "남원", lat: 35.4262, lon: 127.3820 },
        { id: "gokseong", name: "곡성", lat: 35.2818, lon: 127.2941 },
        { id: "gureagu", name: "구례구", lat: 35.1764, lon: 127.4398 },
        { id: "suncheon", name: "순천", lat: 34.9458, lon: 127.5034 },
        { id: "yeocheon", name: "여천", lat: 34.7709, lon: 127.6908 },
        { id: "yeosu-expo", name: "여수엑스포", lat: 34.7523, lon: 127.7459 }
      ],
      "경전선": [
        { id: "seoul", name: "서울", lat: 37.5546, lon: 126.9706 },
        { id: "dongdaegu", name: "동대구", lat: 35.8797, lon: 128.6285 },
        { id: "milyang", name: "밀양", lat: 35.4984, lon: 128.7719 },
        { id: "jinyeong", name: "진영", lat: 35.3129, lon: 128.7289 },
        { id: "changwon-jungang", name: "창원중앙", lat: 35.2281, lon: 128.6946 },
        { id: "changwon", name: "창원", lat: 35.2476, lon: 128.6083 },
        { id: "masan", name: "마산", lat: 35.2346, lon: 128.5835 },
        { id: "jinju", name: "진주", lat: 35.1517, lon: 128.1189 }
      ],
      "강릉선": [
        { id: "seoul", name: "서울", lat: 37.5546, lon: 126.9706 },
        { id: "cheongnyangni", name: "청량리", lat: 37.5801, lon: 127.0450 },
        { id: "yangpyeong", name: "양평", lat: 37.4926, lon: 127.4918 },
        { id: "seowonju", name: "서원주", lat: 37.3693, lon: 127.8427 },
        { id: "manjong", name: "만종", lat: 37.3592, lon: 127.8936 },
        { id: "hoengseong", name: "횡성", lat: 37.4988, lon: 127.9943 },
        { id: "dunnae", name: "둔내", lat: 37.5050, lon: 128.2195 },
        { id: "pyeongchang", name: "평창", lat: 37.5459, lon: 128.4239 },
        { id: "jinbu", name: "진부", lat: 37.6338, lon: 128.5912 },
        { id: "gangneung", name: "강릉", lat: 37.7628, lon: 128.8985 }
      ]
    };

    // OpenWeather API Key 설정
    // 로컬 실행 시 "__WEATHER_API_KEY__" 자리에 실제 API Key를 기입하시거나,
    // Vercel 환경변수(WEATHER_API_KEY)를 빌드 타임에 주입하도록 구성합니다.
    const API_KEY = "__WEATHER_API_KEY__";

    function App() {
      const [selectedLine, setSelectedLine] = useState("경부선");
      const [selectedStation, setSelectedStation] = useState(STATIONS["경부선"][0]);
      const [weather, setWeather] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);

      // 노선 변경 시 해당 노선의 첫 번째 역을 자동 선택
      const handleLineChange = (line) => {
        setSelectedLine(line);
        const firstStation = STATIONS[line][0];
        setSelectedStation(firstStation);
        setSearchQuery("");
      };

      // 날씨 데이터 가져오기
      const fetchWeather = async (lat, lon) => {
        if (!API_KEY || API_KEY === "__WEATHER_API_KEY__") {
          setError("API Key가 설정되지 않았습니다. Vercel 환경 변수 혹은 코드 내 설정을 확인해 주세요.");
          return;
        }
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=kr`
          );
          if (!response.ok) {
            if (response.status === 401) {
              throw new Error("유효하지 않은 API Key입니다. 키를 다시 확인해 주세요.");
            }
            throw new Error("날씨 정보를 가져오는 중 오류가 발생했습니다.");
          }
          const data = await response.json();
          setWeather({
            temp: Math.round(data.main.temp * 10) / 10,
            feelsLike: Math.round(data.main.feels_like * 10) / 10,
            humidity: data.main.humidity,
            windSpeed: data.wind.speed,
            description: data.weather[0].description,
            mainState: data.weather[0].main,
            iconCode: data.weather[0].icon,
            cityName: data.name
          });
        } catch (err) {
          setError(err.message);
          setWeather(null);
        } finally {
          setLoading(false);
        }
      };

      // 선택된 역이 변경될 때 호출
      useEffect(() => {
        if (selectedStation) {
          fetchWeather(selectedStation.lat, selectedStation.lon);
        }
      }, [selectedStation]);

      // 전체 역 목록을 검색하기 위한 플랫 배열
      const allStations = useMemo(() => {
        const uniqueStationsMap = new Map();
        Object.entries(STATIONS).forEach(([lineName, stations]) => {
          stations.forEach(station => {
            if (!uniqueStationsMap.has(station.name)) {
              uniqueStationsMap.set(station.name, {
                ...station,
                lines: [lineName]
              });
            } else {
              uniqueStationsMap.get(station.name).lines.push(lineName);
            }
          });
        });
        return Array.from(uniqueStationsMap.values());
      }, []);

      // 검색어 필터링
      const filteredStations = useMemo(() => {
        if (!searchQuery) return [];
        return allStations.filter(station =>
          station.name.includes(searchQuery)
        );
      }, [searchQuery, allStations]);

      // 날씨 상태별 배경 그라데이션 및 디자인 결정
      const weatherTheme = useMemo(() => {
        if (!weather) return {
          bg: "from-blue-600 to-indigo-700",
          cardBg: "bg-white",
          accentColor: "text-blue-600",
          shadowColor: "shadow-blue-100"
        };
        
        const state = weather.mainState.toLowerCase();
        const icon = weather.iconCode;
        const isNight = icon.includes('n');

        if (isNight) {
          return {
            bg: "from-slate-900 to-indigo-950",
            cardBg: "bg-slate-900 border border-indigo-900 text-white",
            accentColor: "text-indigo-400",
            shadowColor: "shadow-indigo-950/50"
          };
        }

        switch (state) {
          case "clear":
            return {
              bg: "from-amber-400 to-orange-500",
              cardBg: "bg-white text-slate-800",
              accentColor: "text-orange-500",
              shadowColor: "shadow-orange-100"
            };
          case "clouds":
            return {
              bg: "from-sky-400 to-slate-500",
              cardBg: "bg-white text-slate-800",
              accentColor: "text-slate-600",
              shadowColor: "shadow-slate-100"
            };
          case "rain":
          case "drizzle":
            return {
              bg: "from-cyan-700 to-slate-800",
              cardBg: "bg-white text-slate-800",
              accentColor: "text-cyan-600",
              shadowColor: "shadow-cyan-100"
            };
          case "snow":
            return {
              bg: "from-sky-200 to-blue-400",
              cardBg: "bg-white text-slate-800",
              accentColor: "text-sky-500",
              shadowColor: "shadow-blue-500/10"
            };
          case "thunderstorm":
            return {
              bg: "from-purple-800 to-slate-900",
              cardBg: "bg-white text-slate-800",
              accentColor: "text-purple-700",
              shadowColor: "shadow-purple-100"
            };
          default:
            return {
              bg: "from-blue-600 to-indigo-700",
              cardBg: "bg-white text-slate-800",
              accentColor: "text-blue-600",
              shadowColor: "shadow-blue-100"
            };
        }
      }, [weather]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className={`bg-gradient-to-r ${weatherTheme.bg} text-white shadow-lg transition-all duration-700`}>
            <div className="max-w-6xl mx-auto px-4 py-5 md:py-7 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md">
                  <Icons.Train />
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-bold tracking-tight">고속철도 날씨 정보</h1>
                  <p className="text-xs text-white/70 mt-0.5">KTX / SRT 노선별 역 실시간 기상 상태 조회</p>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-4xl w-full mx-auto px-4 py-6 md:py-10 flex flex-col gap-6 md:gap-8">

            {/* 통합 검색창 */}
            <div className="relative">
              <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
                <Icons.Search />
              </div>
              <input
                type="text"
                placeholder="찾으시는 역 이름을 입력해 보세요 (예: 대전, 광주송정, 여수엑스포)"
                value={searchQuery}
                onChange={(e) => {
                  setSearchQuery(e.target.value);
                  setIsDropdownOpen(true);
                }}
                onFocus={() => setIsDropdownOpen(true)}
                className="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-base transition-all placeholder:text-slate-400"
              />
              
              {/* 검색 추천 목록 */}
              {isDropdownOpen && searchQuery && (
                <div className="absolute z-10 w-full mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-60 overflow-y-auto divide-y divide-slate-100">
                  {filteredStations.length > 0 ? (
                    filteredStations.map(station => (
                      <button
                        key={station.id}
                        onClick={() => {
                          setSelectedStation(station);
                          // 해당 역의 대표 노선으로 탭도 같이 변경
                          if (!station.lines.includes(selectedLine)) {
                            setSelectedLine(station.lines[0]);
                          }
                          setSearchQuery("");
                          setIsDropdownOpen(false);
                        }}
                        className="w-full text-left px-5 py-3.5 hover:bg-slate-50 transition flex items-center justify-between"
                      >
                        <span className="font-semibold text-slate-700">{station.name}역</span>
                        <div className="flex gap-1">
                          {station.lines.map(line => (
                            <span key={line} className="text-[10px] font-medium bg-slate-100 text-slate-500 px-2 py-0.5 rounded">
                              {line}
                            </span>
                          ))}
                        </div>
                      </button>
                    ))
                  ) : (
                    <div className="p-4 text-center text-sm text-slate-400">
                      검색 결과가 없습니다.
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* 노선 선택 버튼 그룹 */}
            <div className="flex flex-col gap-3">
              <span className="text-sm font-semibold text-slate-500 tracking-wider">노선별 날씨 조회</span>
              <div className="flex flex-wrap gap-2">
                {Object.keys(STATIONS).map((line) => (
                  <button
                    key={line}
                    onClick={() => handleLineChange(line)}
                    className={`px-5 py-3 rounded-2xl font-semibold text-sm transition-all shadow-sm ${
                      selectedLine === line
                        ? "bg-slate-800 text-white ring-2 ring-slate-800 ring-offset-2"
                        : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"
                    }`}
                  >
                    {line}
                  </button>
                ))}
              </div>
            </div>

            {/* 역 선택 그룹 (선택한 노선 내 역 리스트) */}
            <div className="flex flex-col gap-3">
              <span className="text-sm font-semibold text-slate-500 tracking-wider">역 선택</span>
              <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                {STATIONS[selectedLine].map((station) => (
                  <button
                    key={station.id}
                    onClick={() => {
                      setSelectedStation(station);
                      setSearchQuery("");
                    }}
                    className={`py-3 px-2 rounded-xl text-sm font-medium transition-all text-center truncate ${
                      selectedStation.id === station.id && selectedStation.name === station.name
                        ? "bg-indigo-600 text-white font-bold shadow-md shadow-indigo-100 scale-105"
                        : "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50"
                    }`}
                  >
                    {station.name}
                  </button>
                ))}
              </div>
            </div>

            {/* 날씨 정보 및 로딩/에러 표시 카드 */}
            <div className="mt-2">
              {(!API_KEY || API_KEY === "__WEATHER_API_KEY__") ? (
                <div className="bg-white border-2 border-dashed border-slate-200 rounded-3xl p-12 text-center text-slate-400">
                  <div className="flex justify-center mb-4 text-slate-300">
                    <Icons.Settings />
                  </div>
                  <h3 className="font-semibold text-slate-700 mb-1">API Key가 설정되지 않았습니다</h3>
                  <p className="text-xs leading-relaxed">
                    실시간 날씨 조회를 위해서는 OpenWeather API Key 설정이 필요합니다.<br />
                    코드의 <code className="bg-slate-100 px-1.5 py-0.5 rounded font-mono text-indigo-600">const API_KEY = "__WEATHER_API_KEY__";</code> 부분에 실제 키를 기입하시거나,<br />
                    Vercel 환경 변수(<code className="bg-slate-100 px-1.5 py-0.5 rounded font-mono text-indigo-600">WEATHER_API_KEY</code>) 설정을 연동해 주세요.
                  </p>
                </div>
              ) : loading ? (
                <div className="bg-white rounded-3xl p-16 shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-4">
                  <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                  <span className="text-sm text-slate-400 font-medium">{selectedStation.name}역 날씨 정보를 조회하고 있습니다...</span>
                </div>
              ) : error ? (
                <div className="bg-red-50 border border-red-200 rounded-3xl p-8 text-center text-red-800">
                  <h3 className="font-bold mb-2">날씨 조회 실패</h3>
                  <p className="text-sm">{error}</p>
                </div>
              ) : weather ? (
                <div className={`rounded-3xl shadow-xl overflow-hidden transition-all duration-700 hover:shadow-2xl ${weatherTheme.cardBg}`}>
                  {/* 날씨 정보 카드 메인 헤더 */}
                  <div className="p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b border-slate-100/10">
                    <div>
                      <div className="flex items-center gap-2.5">
                        <span className="text-xs font-bold tracking-widest uppercase bg-black/10 px-2.5 py-1 rounded-full text-current">
                          {selectedLine}
                        </span>
                        <button
                          onClick={() => fetchWeather(selectedStation.lat, selectedStation.lon)}
                          className="hover:rotate-180 transition-all duration-500 p-1 opacity-70 hover:opacity-100"
                          title="새로고침"
                        >
                          <Icons.Refresh />
                        </button>
                      </div>
                      <h2 className="text-3xl md:text-4xl font-extrabold mt-3 tracking-tight">
                        {selectedStation.name}역 날씨
                      </h2>
                      <p className="text-xs opacity-75 mt-1.5">위도: {selectedStation.lat.toFixed(4)} / 경도: {selectedStation.lon.toFixed(4)}</p>
                    </div>

                    <div className="flex items-center gap-4">
                      {/* 날씨 이미지 */}
                      <img
                        src={`https://openweathermap.org/img/wn/${weather.iconCode}@4x.png`}
                        alt={weather.description}
                        className="w-20 h-20 md:w-24 md:h-24 drop-shadow-md animate-bounce"
                        style={{ animationDuration: '3s' }}
                      />
                      <div>
                        <div className="text-4xl md:text-5xl font-black tracking-tighter">
                          {weather.temp}°C
                        </div>
                        <div className="text-sm font-semibold capitalize opacity-85 mt-1">
                          {weather.description}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* 세부 기상 지표 그리드 */}
                  <div className="grid grid-cols-3 divide-x divide-slate-100/15 bg-black/5">
                    {/* 체감온도 */}
                    <div className="p-5 md:p-7 flex flex-col items-center gap-2 text-center">
                      <span className="opacity-75 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                        <Icons.Temp />
                        체감 온도
                      </span>
                      <span className="text-lg md:text-2xl font-bold">{weather.feelsLike}°C</span>
                    </div>

                    {/* 습도 */}
                    <div className="p-5 md:p-7 flex flex-col items-center gap-2 text-center">
                      <span className="opacity-75 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                        <Icons.Droplets />
                        습도
                      </span>
                      <span className="text-lg md:text-2xl font-bold">{weather.humidity}%</span>
                    </div>

                    {/* 풍속 */}
                    <div className="p-5 md:p-7 flex flex-col items-center gap-2 text-center">
                      <span className="opacity-75 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                        <Icons.Wind />
                        바람 세기
                      </span>
                      <span className="text-lg md:text-2xl font-bold">{weather.windSpeed} m/s</span>
                    </div>
                  </div>
                </div>
              ) : null}
            </div>
          </main>

          <footer className="bg-slate-100 border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <p>© 2026 고속철도 날씨 정보 서비스. All rights reserved.</p>
              <div className="flex gap-4">
                <a href="https://openweathermap.org/" target="_blank" rel="noopener noreferrer" className="hover:underline font-semibold">OpenWeather Map API</a>
                <span>|</span>
                <span className="font-medium">기반 인프라: React & Tailwind CSS</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
